<svg width="1000" height="450" viewBox="0 0 1000 450" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MedBook architecture: patients use the mobile app, doctors and admins use the web dashboard, both talk to an ASP.NET Core API that uses PostgreSQL and a FastAPI AI service backed by Gemini">
  <style>
    .card { fill: #ffffff; stroke: #d0d7de; }
    .actor { fill: #f6f8fa; stroke: #d0d7de; }
    .title { fill: #1f2328; font-family: 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 700; }
    .sub { fill: #57606a; font-family: 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; font-size: 12px; }
    .label { fill: #57606a; font-family: ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace; font-size: 11px; }
    .zone { stroke: #8b949e; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #161b22; stroke: #30363d; }
      .actor { fill: #0d1117; stroke: #30363d; }
      .title { fill: #ffffff; }
      .sub { fill: #8b949e; }
      .label { fill: #8b949e; }
    }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#8b949e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Railway zone -->
  <rect class="zone" x="425" y="44" width="270" height="272" rx="16" stroke-width="1.2" stroke-dasharray="6 5" opacity="0.7"/>
  <text class="label" x="445" y="66" letter-spacing="3">RAILWAY</text>
  <text class="label" x="445" y="306">Two independently deployed services</text>

  <!-- Actor: Patients -->
  <rect class="actor" x="15" y="76" width="165" height="92" rx="46"/>
  <circle cx="52" cy="122" r="16" fill="#0ea5e9" opacity="0.18"/>
  <circle cx="52" cy="116" r="5" fill="#0ea5e9"/>
  <path d="M42 132C42 126 62 126 62 132" stroke="#0ea5e9" stroke-width="2.4" stroke-linecap="round"/>
  <text class="title" x="78" y="116">Patients</text>
  <text class="sub" x="78" y="136">Book · Ask the AI</text>

  <!-- Actor: Doctors & Admins -->
  <rect class="actor" x="15" y="200" width="165" height="92" rx="46"/>
  <circle cx="52" cy="246" r="16" fill="#f89820" opacity="0.2"/>
  <circle cx="52" cy="240" r="5" fill="#f89820"/>
  <path d="M42 256C42 250 62 250 62 256" stroke="#f89820" stroke-width="2.4" stroke-linecap="round"/>
  <text class="title" x="78" y="238">Doctors &amp;</text>
  <text class="title" x="78" y="258">Admins</text>

  <!-- Mobile App -->
  <rect class="card" x="215" y="76" width="190" height="92" rx="12"/>
  <rect x="215" y="90" width="4" height="64" rx="2" fill="#0ea5e9"/>
  <text class="title" x="239" y="110">Mobile App</text>
  <text class="sub" x="239" y="134">React Native</text>
  <text class="sub" x="239" y="152">Booking · Vitals · AI chat</text>

  <!-- Web Dashboard -->
  <rect class="card" x="215" y="200" width="190" height="92" rx="12"/>
  <rect x="215" y="214" width="4" height="64" rx="2" fill="#f89820"/>
  <text class="title" x="239" y="234">Web Dashboard</text>
  <text class="sub" x="239" y="258">Manage the platform</text>

  <!-- Core API -->
  <rect class="card" x="445" y="76" width="230" height="92" rx="12"/>
  <rect x="445" y="90" width="4" height="64" rx="2" fill="#8250df"/>
  <text class="title" x="469" y="110">Core API</text>
  <text class="sub" x="469" y="134">ASP.NET Core (.NET 8)</text>
  <text class="sub" x="469" y="152">JWT · Roles · EF Core · Swagger</text>

  <!-- AI Service -->
  <rect class="card" x="445" y="200" width="230" height="92" rx="12"/>
  <rect x="445" y="214" width="4" height="64" rx="2" fill="#14b8a6"/>
  <text class="title" x="469" y="234">AI Service</text>
  <text class="sub" x="469" y="258">FastAPI · RAG pipeline</text>
  <text class="sub" x="469" y="276">sentence-transformers · ChromaDB</text>

  <!-- PostgreSQL -->
  <rect class="card" x="830" y="76" width="140" height="92" rx="12"/>
  <rect x="830" y="90" width="4" height="64" rx="2" fill="#316192"/>
  <text class="title" x="854" y="110">PostgreSQL</text>
  <text class="sub" x="854" y="134">Neon</text>

  <!-- Gemini -->
  <rect class="card" x="830" y="200" width="140" height="92" rx="12"/>
  <rect x="830" y="214" width="4" height="64" rx="2" fill="#8e75b2"/>
  <text class="title" x="854" y="234">Gemini API</text>
  <text class="sub" x="854" y="258">LLM responses</text>

  <!-- Arrows: actors to clients -->
  <path d="M182 122H213" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M182 246H213" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- Arrows: clients to Core API -->
  <path d="M407 122H443" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
  <text class="label" x="425" y="114" text-anchor="middle">REST</text>
  <path d="M407 246H416V150H443" stroke="#8b949e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arr)"/>

  <!-- Core API to AI Service -->
  <path d="M560 170V198" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
  <text class="label" x="570" y="188">question</text>

  <!-- Services to data -->
  <path d="M677 122H828" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
  <text class="label" x="752" y="114" text-anchor="middle">EF Core</text>
  <path d="M677 246H828" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
  <text class="label" x="752" y="238" text-anchor="middle">context + prompt</text>

  <!-- What it does -->
  <text class="label" x="15" y="352" letter-spacing="3">WHAT IT DOES</text>

  <rect class="card" x="15" y="364" width="305" height="76" rx="12"/>
  <rect x="15" y="376" width="4" height="52" rx="2" fill="#0ea5e9"/>
  <text class="title" x="39" y="392">Patient health record</text>
  <text class="sub" x="39" y="412">Patients log their data and vitals,</text>
  <text class="sub" x="39" y="428">so doctors see the full picture.</text>

  <rect class="card" x="347" y="364" width="305" height="76" rx="12"/>
  <rect x="347" y="376" width="4" height="52" rx="2" fill="#14b8a6"/>
  <text class="title" x="371" y="392">AI case summary</text>
  <text class="sub" x="371" y="412">Summarizes the patient's condition</text>
  <text class="sub" x="371" y="428">continuously as new data comes in.</text>

  <rect class="card" x="679" y="364" width="305" height="76" rx="12"/>
  <rect x="679" y="376" width="4" height="52" rx="2" fill="#ef4444"/>
  <text class="title" x="703" y="392">Safety alerts</text>
  <text class="sub" x="703" y="412">Alerts when readings look dangerous</text>
  <text class="sub" x="703" y="428">or a treatment looks wrong.</text>
</svg>
